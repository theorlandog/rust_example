name: Release

on:
  push:
    # Releases are cut by pushing a tag:
    #     cargo set-version 0.3.0   # or edit Cargo.toml by hand
    #     git commit -am "Release 0.3.0" && git tag v0.3.0
    #     git push origin main --tags
    tags: ['v*']
  # Also runnable by hand, which builds and uploads the installers as workflow
  # artifacts without publishing a release -- the way to test a change to the
  # packaging without burning a version number.
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  linux:
    name: Debian and RPM packages
    # Deliberately not ubuntu-latest. A binary linked against an older glibc
    # runs on newer distributions, but not the other way round, so the oldest
    # supported runner produces the most widely installable package.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install the packaging tools
        run: cargo install cargo-deb cargo-generate-rpm --locked

      - run: ./packaging/linux/build-packages.sh

      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS installer
    # arm64 runner; the build produces a universal binary that also runs on
    # Intel, so one job covers both architectures.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - run: ./packaging/macos/build-pkg.sh
        env:
          # Set these as repository secrets to ship a package that Gatekeeper
          # accepts. Unset, the build still succeeds and produces an unsigned
          # .pkg, which users must right-click to open.
          MACOS_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}

      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      # The WiX v5 command line tool is a .NET global tool. Pinning the major
      # version keeps a WiX release from changing the installer under us.
      - name: Install the WiX Toolset
        run: |
          dotnet tool install --global wix --version 5.*
          wix extension add --global WixToolset.UI.wixext/5.*

      # pwsh (PowerShell 7) rather than the default Windows PowerShell 5.1.
      - shell: pwsh
        run: ./packaging/windows/build-msi.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [linux, macos, windows]
    # Only a tag push publishes; a manual run stops after building, leaving the
    # installers downloadable from the workflow run.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Needed to create the release and upload assets to it.
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version." >&2
            echo "Fix the version, retag, and push again." >&2
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: dist

      # Checksums let anyone verify a download, and are cheap to publish:
      #     sha256sum --check --ignore-missing SHA256SUMS
      - name: Generate checksums
        working-directory: dist
        run: sha256sum -- * | tee SHA256SUMS

      # `gh` is preinstalled on GitHub runners and authenticates from
      # GITHUB_TOKEN, so publishing needs no third-party action.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            dist/*
